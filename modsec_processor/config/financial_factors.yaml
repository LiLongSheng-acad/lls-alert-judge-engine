# ---------- 基础资产价值 ----------
# 所有资产价值的基数，用户配置的权重将乘以这个值
base_asset_value: 10000

# ---------- 默认权重 ----------
# 未配置资产的 IP 使用的默认权重
default_weight: 1.0

# ---------- 人力成本 ----------
labor_cost:
  monthly_salary: 20000
  hours_per_month: 160
  minutes_per_alert: 15

# ---------- 决策阈值 ----------
ignore_threshold: 0.01
max_score: 1000000