# ============================================================
# 评分模型配置（单次损失模型）
# ============================================================
# 优先级 = 单次漏洞损失(元) × 目标权重
#   - 单次漏洞损失：见下方 attack_loss 表（每种攻击类型 × 等级 → 元）
#   - 目标权重：仅表达系统重要性，约定在 0.5 ~ 3 之间小幅摆动
#   - 红线 red_line：优先级低于它 → 「看了就亏」（可以不看，但照常展示、标绿）
#
# 表值为「示意默认值」，按护网 / 众测分级比例推导，可由甲方按现场校准。
# ============================================================

# ---------- 单次漏洞损失（单位：元）----------
# 等级相对系数：CRITICAL 1 · HIGH 0.5 · MEDIUM 0.1 · LOW 0.02 · INFO 0.002
# 每个类型保留 DEFAULT 兜底行（漏配等级 / 未知等级时回落到它）
attack_loss:
  RCE:
    CRITICAL: 500000
    HIGH: 250000
    MEDIUM: 50000
    LOW: 10000
    INFO: 1000
    DEFAULT: 50000
  COMMAND_INJECTION:
    CRITICAL: 500000
    HIGH: 250000
    MEDIUM: 50000
    LOW: 10000
    INFO: 1000
    DEFAULT: 50000
  DESERIALIZATION:
    CRITICAL: 400000
    HIGH: 200000
    MEDIUM: 40000
    LOW: 8000
    INFO: 800
    DEFAULT: 40000
  SSTI:
    CRITICAL: 400000
    HIGH: 200000
    MEDIUM: 40000
    LOW: 8000
    INFO: 800
    DEFAULT: 40000
  SQLI:
    CRITICAL: 300000
    HIGH: 150000
    MEDIUM: 30000
    LOW: 6000
    INFO: 600
    DEFAULT: 30000
  LFI:
    CRITICAL: 250000
    HIGH: 125000
    MEDIUM: 25000
    LOW: 5000
    INFO: 500
    DEFAULT: 25000
  RFI:
    CRITICAL: 250000
    HIGH: 125000
    MEDIUM: 25000
    LOW: 5000
    INFO: 500
    DEFAULT: 25000
  # 多词标签会被适配器统一为下划线形式：attack-file-upload → FILE_UPLOAD
  FILE_UPLOAD:
    CRITICAL: 250000
    HIGH: 125000
    MEDIUM: 25000
    LOW: 5000
    INFO: 500
    DEFAULT: 25000
  SSRF:
    CRITICAL: 150000
    HIGH: 75000
    MEDIUM: 15000
    LOW: 3000
    INFO: 300
    DEFAULT: 15000
  XSS:
    CRITICAL: 50000
    HIGH: 25000
    MEDIUM: 5000
    LOW: 1000
    INFO: 100
    DEFAULT: 5000
  OPEN_REDIRECT:
    CRITICAL: 10000
    HIGH: 5000
    MEDIUM: 1000
    LOW: 200
    INFO: 20
    DEFAULT: 1000
  UNKNOWN:
    CRITICAL: 5000
    HIGH: 2500
    MEDIUM: 500
    LOW: 100
    INFO: 10
    DEFAULT: 500
  # 扫描 / 探测类：本身不是漏洞，价值极低（不随等级变化）
  PROTOCOL:
    DEFAULT: 0.5
  GENERIC:
    DEFAULT: 0.5
  # 全局兜底：攻击类型完全未知时
  DEFAULT:
    DEFAULT: 0.5

# ---------- 默认权重 ----------
# 未配置资产的 IP 使用的权重（目标权重约定范围 0.5 ~ 3）
default_weight: 1.0

# ---------- 人力成本 ----------
# 仅作参考：红线「看了就亏」的直觉来自「单条处置成本」。
labor_cost:
  monthly_salary: 20000
  hours_per_month: 160
  minutes_per_alert: 15

# ---------- 决策阈值 ----------
# 红线：优先级(=单次漏洞损失 × 目标权重) 低于该值时，视为「看了就亏」。
# 语义：可以不看，但告警照常入库、照常展示（仅标绿，不隐藏、不沉底）。
# 这是指导值，可按甲方现场调整。
red_line: 30

# 分数封顶（安全网，防止异常值）
max_score: 10000000
